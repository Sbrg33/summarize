name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 10:17 UTC.
    - cron: "17 10 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/steipete/summarize.git
          git fetch upstream main

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set -euo pipefail
          git checkout -B sync-upstream origin/main

          if git merge --no-edit upstream/main; then
            if git diff --quiet origin/main HEAD; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No upstream changes to sync."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Upstream merge produced conflicts. Resolve manually."
            git status --short
            exit 1
          fi

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin sync-upstream

      - name: Open or update pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view sync-upstream --base main >/dev/null 2>&1; then
            gh pr edit sync-upstream \
              --base main \
              --title "Sync upstream steipete/summarize" \
              --body "Automated weekly sync from upstream repository. Review before merging."
          else
            gh pr create \
              --base main \
              --head sync-upstream \
              --title "Sync upstream steipete/summarize" \
              --body "Automated weekly sync from upstream repository. Review before merging."
          fi
